
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Game World</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px 20px;
    }
    h1 { color: #60a5fa; }
    .box {
      background: #1e293b;
      border-radius: 15px;
      padding: 25px;
      max-width: 500px;
      margin: 30px auto;
    }
    a {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>🎮 Meine Game World</h1>
  <div class="box">
    <h2>Willkommen!</h2>
    <p>Meine eigene Spiele-Webseite.</p>
    <p>Hier kommen bald meine Spiele hin.</p>
  </div>
</body>
</html>
